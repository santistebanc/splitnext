    ${SETTLE.map(([n, v]) => `<div class="erow"><span class="c" style="width:32px;height:32px;border-radius:50%;background:${SOFT[n]};display:grid;place-items:center;font-weight:800;font-size:13px;flex:none">${n === 'You' ? 'A' : n[0]}</span><div><div class="t">${n === 'You' ? 'You pay' : n + ' pays'} Ben</div><div class="s tn">${f(v)}</div></div><span class="v" style="font-size:14px">Record</span></div>`).join('')}`;
  },
};
