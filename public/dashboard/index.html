<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Splitnext API synchronization tester.">
    <title>Splitnext tester</title>
    <link rel="stylesheet" href="/dashboard/styles.css">
    <script type="module" src="/dashboard/app.js"></script>
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="icon-online" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14 0M1.5 9a16 16 0 0 1 21 0M8.5 16.1a6 6 0 0 1 7 0M12 20h.01"/></symbol>
      <symbol id="icon-offline" viewBox="0 0 24 24"><path d="M2 2l20 20M8.5 16.1a6 6 0 0 1 7 0M5 12.55a11 11 0 0 1 5.2-2.4M16.7 10.7A11 11 0 0 1 19 12.55M1.5 9a16 16 0 0 1 4.8-2.9M10.7 5.1A16 16 0 0 1 22.5 9M12 20h.01"/></symbol>
      <symbol id="icon-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></symbol>
      <symbol id="icon-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16M3 21v-5h5M3 12a9 9 0 0 1 15.4-6.4L21 8M21 3v5h-5"/></symbol>
      <symbol id="icon-leave" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></symbol>
      <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
      <symbol id="icon-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.7 5.7l12.6 12.6"/></symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    </svg>

    <header class="topbar">
      <strong>Splitnext tester</strong>
      <div class="topbar-status">
        <span id="health-status" class="status neutral">Worker…</span>
        <span id="ready-status" class="status neutral">Storage…</span>
        <a href="/docs">API</a>
      </div>
    </header>

    <main>
      <section class="setup">
        <div class="setup-toolbar">
          <button id="add-device" type="button">Add device</button>
          <span id="setup-summary">Add a device to begin.</span>
        </div>
      </section>

      <section class="replica-grid" id="replica-grid">
        <section class="replica-zone server-zone" aria-labelledby="server-title">
          <header class="zone-header">
            <h2 id="server-title">Server</h2>
            <span class="revision">Revision <strong id="server-revision">—</strong></span>
            <div class="header-actions">
              <button id="toggle-server" class="icon-button connection-toggle online" type="button" title="Online" aria-label="Online"><svg class="icon" aria-hidden="true"><use href="#icon-online"></use></svg></button>
              <button id="refresh-server" class="icon-button secondary" type="button" title="Refresh server state" aria-label="Refresh server state"><svg class="icon" aria-hidden="true"><use href="#icon-sync"></use></svg></button>
              <button id="reset-server" class="danger-text" type="button" title="Erase identities and all indexed groups, then start over">Reset data</button>
            </div>
          </header>
          <div class="identity-line">D1 · Identity directory</div>
          <div id="server-identity-list" class="identity-directory"><span class="empty">Loading identities…</span></div>

          <nav class="group-tabs" aria-label="Groups on the server">
            <div class="tab-strip" id="server-group-tabs" role="tablist"></div>
          </nav>

          <div class="server-group" id="server-group-summary"><span class="empty">No group.</span></div>
          <div class="member-list" id="server-member-list"></div>

          <div class="identity-line">Durable Object · Realtime subscribers</div>
          <div id="server-subscribers" class="realtime-log"><span class="empty">No subscribers.</span></div>

          <section class="traffic-section">
            <div class="section-bar"><strong>Incoming requests</strong><button id="clear-server-traffic" class="text-button" type="button">Clear</button></div>
            <div id="server-incoming" class="request-log"><span class="empty">No requests.</span></div>
          </section>

          <details><summary>Server data</summary><pre id="server-state">{}</pre></details>
        </section>
      </section>
    </main>

    <template id="device-template">
        <section class="replica-zone device-zone">
          <header class="zone-header">
            <h2 data-role="label">Device</h2>
            <span class="revision">Revision <strong data-role="revision">—</strong></span>
            <button class="icon-button remove-device" data-action="remove-device" type="button" title="Remove device: discards its local data; its identity stays on the server" aria-label="Remove device"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg></button>
            <div class="header-actions">
              <button class="icon-button connection-toggle online" data-action="toggle-device" type="button" title="Online" aria-label="Online"><svg class="icon" aria-hidden="true"><use href="#icon-online"></use></svg></button>
              <button class="icon-button realtime-toggle off" data-action="toggle-realtime" type="button" title="Live updates off" aria-label="Live updates off"><svg class="icon" aria-hidden="true"><use href="#icon-live"></use></svg></button>
              <button class="icon-button secondary" data-action="sync" type="button" title="Sync this group now" aria-label="Sync this group now"><svg class="icon" aria-hidden="true"><use href="#icon-sync"></use></svg></button>
              <button class="icon-button danger-text" data-action="leave" type="button" title="Leave this group" aria-label="Leave this group"><svg class="icon" aria-hidden="true"><use href="#icon-leave"></use></svg></button>
            </div>
          </header>
          <div class="identity-line" data-role="identity">Not initialized</div>

          <nav class="group-tabs" aria-label="Groups">
            <div class="tab-strip" data-role="group-list" role="tablist"></div>
            <button class="group-tab new-tab" data-action="new-group-tab" type="button" role="tab" title="Create a group or join one with a link">+ New</button>
            <button class="icon-button refresh-groups" data-action="refresh-groups" type="button" title="Refresh the group list from the server" aria-label="Refresh groups"><svg class="icon" aria-hidden="true"><use href="#icon-sync"></use></svg></button>
          </nav>

          <section class="group-forms" data-role="group-forms" hidden>
            <strong>Create a group</strong>
              <form class="create-group" data-action-form="create-group">
                <input name="name" aria-label="Group name" maxlength="100" required value="Berlin flat">
                <input name="creator_member_name" aria-label="Your member name" maxlength="100" required placeholder="Your name">
                <input class="currency" name="currency_code" aria-label="Currency code" minlength="3" maxlength="3" required value="EUR">
                <button type="submit">Create</button>
              </form>
            <strong>Join with an invite link</strong>
              <form class="join-group" data-action-form="join-group">
                <input data-role="join-link" aria-label="Invite link" required placeholder="Paste an invite link">
                <select data-role="join-member" aria-label="Who are you?" disabled>
                  <option value="">Who are you?</option>
                </select>
                <input data-role="join-name" aria-label="New member name" maxlength="100" placeholder="Your name">
                <button type="submit" disabled>Join</button>
                <small data-role="join-preview" class="join-preview"></small>
              </form>
          </section>

          <div class="group-pane" data-role="group-pane">

          <form class="rejoin-group" data-action-form="rejoin" hidden>
            <strong>You left this group. Rejoin as:</strong>
            <select data-role="rejoin-member" aria-label="Who are you?"></select>
            <input data-role="rejoin-name" aria-label="New member name" maxlength="100" placeholder="Your name">
            <button type="submit">Rejoin</button>
          </form>

          <div data-role="actions">
            <div class="group-editor" data-role="group-editor">
              <div class="name-line" data-edit="group">
                <strong class="editable-name" data-role="name-label">No group</strong>
                <button class="edit-button" data-action="edit-name" type="button" title="Rename group" aria-label="Rename group"><svg class="icon" aria-hidden="true"><use href="#icon-edit"></use></svg></button>
              </div>
              <small data-role="group-detail"></small>
            </div>

            <div class="member-list" data-role="member-list"></div>
            <form class="add-member" data-action-form="add-member">
              <input name="display_name" aria-label="New member name" maxlength="100" required placeholder="Add member">
              <button type="submit">Add</button>
            </form>

            <section class="invite-section">
              <div class="section-bar"><strong>Invite link</strong><span class="section-note" data-role="invite-status">No link</span></div>
              <div class="invite-link-row">
                <input data-role="invite-link" readonly aria-label="Invite link" placeholder="Only the device that created the link can show it">
                <button class="icon-button secondary" type="button" data-action="copy-invite" title="Copy link" aria-label="Copy link"><svg class="icon" aria-hidden="true"><use href="#icon-copy"></use></svg></button>
              </div>
              <div class="invite-controls">
                <select data-role="invite-expiry" aria-label="Link lifetime">
                  <option value="1">1 hour</option>
                  <option value="24">1 day</option>
                  <option value="168" selected>7 days</option>
                  <option value="720">30 days</option>
                </select>
                <button type="button" data-action="create-invite">Create link</button>
                <button class="icon-button danger-text" type="button" data-action="revoke-invite" title="Revoke link; people who joined keep access" aria-label="Revoke link"><svg class="icon" aria-hidden="true"><use href="#icon-ban"></use></svg></button>
              </div>
            </section>

          </div>
          </div>

          <section class="command-section">
            <div class="section-bar"><strong>Commands</strong></div>
            <div class="command-list" data-role="commands"><span class="empty">No commands.</span></div>
          </section>

          <section class="realtime-section">
            <div class="section-bar"><strong>Realtime</strong><span class="section-note">Announcements only; state arrives by sync</span></div>
            <div class="realtime-log" data-role="realtime-events"><span class="empty">No realtime activity.</span></div>
          </section>

          <section class="traffic-section">
            <div class="section-bar"><strong>Requests</strong><button class="text-button" data-action="clear-traffic" type="button">Clear</button></div>
            <div class="request-log" data-role="requests"><span class="empty">No requests.</span></div>
          </section>

          <details><summary>Local data</summary><pre data-role="raw-state">{}</pre></details>
        </section>
    </template>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
