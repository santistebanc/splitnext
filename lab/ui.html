<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <title>Splitnext device lab</title>
  <style>
    @font-face {
      font-family: Instrument;
      src: url("/font.woff2");
    }
    * {
      box-sizing: border-box;
    }
    [hidden]:not(.slot *) {
      display: none !important;
    }
    :root {
      color-scheme: dark;
      /* Warm neutrals and the burnt accent of the app, lifted for a dark page. */
      --bg: #121211;
      --sunken: #0d0d0c;
      --surface: #1a1a18;
      --raised: #242422;
      --hover: #2e2d2a;
      --border: #2c2b28;
      --border-strong: #46453f;
      --text: #ecebe6;
      --muted: #a3a198;
      --accent: #ec8f5e;
      --accent-text: #1c120c;
      --good: #5fd39c;
      --warn: #f2b45a;
      --danger: #ff8a70;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
      --radius: 6px;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font:
        14px/1.45 Instrument,
        system-ui,
        sans-serif;
    }
    header {
      flex: none;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      gap: 12px 24px;
      align-items: center;
      flex-wrap: wrap;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
    }
    h1 .dim {
      color: var(--muted);
      font-weight: 400;
    }
    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-inline-start: auto;
    }
    #status {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font: 12px Instrument, system-ui, sans-serif;
      color: var(--muted);
      white-space: nowrap;
    }
    .chip[data-tone]::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .chip[data-tone="good"] {
      color: var(--good);
    }
    .chip[data-tone="bad"] {
      color: var(--warn);
      border-color: color-mix(in srgb, var(--warn) 40%, transparent);
    }
    #hosting {
      font-size: 12px;
      color: var(--muted);
    }

    /* Lab controls. Selectors stop at .slot: in-page devices are the app's own UI. */
    button:not(.slot *),
    input:not(.slot *),
    select:not(.slot *),
    textarea:not(.slot *) {
      font: inherit;
      font-size: 13px;
      color: inherit;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--raised);
      padding: 5px 10px;
      min-height: 30px;
    }
    button:not(.slot *) {
      cursor: pointer;
      white-space: nowrap;
      transition:
        background-color 120ms ease,
        border-color 120ms ease,
        transform 100ms var(--ease-out);
    }
    button:not(.slot *):hover {
      background: var(--hover);
    }
    button:not(.slot *):active {
      transform: scale(0.97);
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
    }
    button.primary:hover {
      background: color-mix(in srgb, var(--accent) 88%, white);
    }
    button.ghost:not(:hover) {
      background: transparent;
      border-color: transparent;
    }
    button.danger {
      color: var(--danger);
      background: transparent;
      border-color: color-mix(in srgb, var(--danger) 35%, transparent);
    }
    button.danger:hover {
      background: color-mix(in srgb, var(--danger) 14%, transparent);
    }
    button[aria-expanded="false"]:not(.slot *) {
      color: var(--muted);
    }
    :focus-visible:not(.slot *) {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    select:not(.slot *) {
      padding-inline-end: 6px;
    }
    textarea:not(.slot *) {
      width: 100%;
      min-height: 96px;
      font: 12px/1.5 var(--mono);
      background: var(--sunken);
      resize: vertical;
    }
    pre:not(.slot *) {
      margin: 0;
      padding: 8px 10px;
      font: 12px/1.5 var(--mono);
      color: #d6d4cc;
      background: var(--sunken);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    pre:empty {
      display: none;
    }
    details:not(.slot *) > summary {
      cursor: pointer;
      padding: 4px 0;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    details:not(.slot *) > summary:hover {
      color: var(--text);
    }
    .label {
      display: block;
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .tools .end {
      margin-inline-start: auto;
    }
    .segmented {
      display: inline-flex;
      padding: 2px;
      gap: 2px;
      border: 1px solid var(--border-strong);
      border-radius: calc(var(--radius) + 2px);
      background: var(--sunken);
    }
    .segmented button:not(.slot *) {
      border-color: transparent;
      background: transparent;
      color: var(--muted);
      min-height: 26px;
      padding: 3px 10px;
    }
    .segmented button:not(.slot *):hover {
      color: var(--text);
      background: var(--raised);
    }
    .segmented button[aria-pressed="true"]:not(.slot *) {
      background: var(--hover);
      border-color: var(--border-strong);
      color: var(--text);
    }
    .control-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      align-items: center;
      gap: 8px;
    }
    .control-row > .segmented {
      justify-self: start;
    }
    .control-row > span {
      color: var(--muted);
      font-size: 13px;
    }

    /* The page is one screen: sections share it and each panel scrolls on its own. */
    #workspace {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    .dock-split {
      display: flex;
      min-width: 0;
      min-height: 0;
    }
    .dock-split[data-direction="column"] {
      flex-direction: column;
    }
    #workspace > *,
    .dock-split > :not(.dock-separator) {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
    }
    .dock-section {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      overflow: hidden;
    }
    .dock-tabs {
      flex: none;
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    button.dock-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 0 12px;
      border: 0;
      border-right: 1px solid var(--border);
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    button.dock-tab:hover {
      background: var(--surface);
      color: var(--text);
    }
    button.dock-tab:active {
      transform: none;
    }
    button.dock-tab[aria-selected="true"] {
      background: var(--surface);
      color: var(--text);
      box-shadow: inset 0 2px 0 var(--accent);
    }
    button.dock-tab:focus-visible {
      outline-offset: -2px;
    }
    .dock-tab[data-tone]::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--good);
    }
    .dock-tab[data-tone="bad"]::before {
      background: var(--warn);
    }
    .dock-tab-detail {
      color: var(--muted);
      font-weight: 400;
    }
    .dock-tab[data-dragging] {
      opacity: 0.5;
    }
    /* The × keeps its room so the tab does not shift when it appears on hover. */
    .dock-tab-close {
      display: grid;
      place-content: center;
      width: 18px;
      height: 18px;
      margin-inline: 2px -6px;
      border-radius: 4px;
      font-size: 15px;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      visibility: hidden;
    }
    .dock-tab:is(:hover, :focus-visible) .dock-tab-close {
      visibility: visible;
    }
    .dock-tab-close:hover {
      background: var(--hover);
      color: var(--text);
    }
    #workspace[data-dragging],
    #workspace[data-dragging] * {
      cursor: grabbing !important;
      user-select: none;
    }
    .dock-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .dock-panel {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }
    .dock-separator {
      flex: none;
      position: relative;
      z-index: 1;
      background: var(--border);
      touch-action: none;
      transition: background-color 120ms ease;
    }
    .dock-split[data-direction="row"] > .dock-separator {
      width: 1px;
      cursor: col-resize;
    }
    .dock-split[data-direction="column"] > .dock-separator {
      height: 1px;
      cursor: row-resize;
    }
    /* A wider grip than the line it draws. */
    .dock-separator::before {
      content: "";
      position: absolute;
      inset: 0 -3px;
    }
    .dock-split[data-direction="column"] > .dock-separator::before {
      inset: -3px 0;
    }
    .dock-separator:hover,
    .dock-separator[data-resizing],
    .dock-separator:focus-visible {
      background: var(--accent);
      outline: none;
    }
    .dock-ghost {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 20;
      padding: 4px 10px;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      background: var(--raised);
      box-shadow: 0 10px 30px rgb(0 0 0 / 50%);
      font-size: 12px;
      pointer-events: none;
    }
    .dock-drop {
      position: fixed;
      z-index: 19;
      border: 2px solid color-mix(in srgb, var(--accent) 80%, transparent);
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      pointer-events: none;
      transition:
        left 120ms var(--ease-out),
        top 120ms var(--ease-out),
        width 120ms var(--ease-out),
        height 120ms var(--ease-out);
    }
    .dock-drop[data-zone="tabs"] {
      border: 0;
      background: var(--accent);
    }

    h2:not(.slot *) {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }
    .empty-devices {
      display: grid;
      place-content: center;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }

    /* A device panel never scrolls as a whole: the screen's viewport and the inspector
       each scroll on their own. Clip, unlike hidden, also stops focus and scrollIntoView
       inside the live app from scrolling these. */
    .device {
      display: flex;
      flex-direction: column;
      overflow: clip;
    }
    .device-split {
      flex: 1;
      min-height: 0;
      display: flex;
      overflow: clip;
    }
    /* Like Chrome's device mode: a compact toolbar above a viewport that holds the screen.
       It narrows to its minimum first, then the inspector gives way. */
    .device-screen {
      flex: 1 1 0;
      min-width: 160px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: clip;
      background: var(--sunken);
    }
    .device-toolbar {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 8px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .device-toolbar :is(button, select, input):not(.slot *) {
      min-height: 26px;
      padding: 2px 6px;
      font-size: 12px;
    }
    .device-toolbar select:not(.slot *) {
      max-width: 150px;
      border-color: transparent;
      background: transparent;
    }
    .device-toolbar select:not(.slot *):hover {
      background: var(--hover);
    }
    .device-toolbar .screen-dimension {
      width: 58px;
      text-align: center;
      font-family: var(--mono);
      background: var(--sunken);
      appearance: textfield;
    }
    .device-toolbar .screen-dimension::-webkit-inner-spin-button {
      appearance: none;
    }
    .device-toolbar .times {
      color: var(--muted);
      font-size: 12px;
    }
    .device-toolbar .icon {
      min-width: 26px;
      font-size: 15px;
      line-height: 1;
    }
    .toolbar-divider {
      align-self: stretch;
      width: 1px;
      margin: 3px 4px;
      background: var(--border);
    }
    /* The device's own controls, in one thin bar across the screen and the inspector. */
    .device-bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 2px;
      min-height: 28px;
      padding: 1px 6px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .device-bar button:not(.slot *) {
      min-height: 24px;
      padding: 1px 8px;
      font-size: 12px;
    }
    .network-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .network-toggle::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--good);
    }
    .network-toggle[data-tone="bad"] {
      color: var(--warn);
    }
    .network-toggle[data-tone="bad"]::before {
      background: var(--warn);
    }
    .bar-spacer {
      flex: 1;
    }
    .device-viewport {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: flex-start;
      overflow: auto;
      /* Room for the handles beyond the right and bottom edges. */
      padding: 16px 28px 28px 16px;
    }
    /* Full panel: the screen fills the viewport edge to edge, with no frame or handles. */
    .device-viewport[data-full] {
      padding: 0;
    }
    .device-viewport[data-full] .screen-frame {
      border: 0;
      box-shadow: none;
    }
    .device-viewport[data-full] .screen-handle {
      display: none;
    }
    /* Sized by the script: the device's screen times its zoom, plus the border. Auto margins centre it and still scroll. */
    .screen-stage {
      position: relative;
      flex: none;
      margin-inline: auto;
    }
    .screen-frame {
      width: 100%;
      height: 100%;
      border: 1px solid var(--border-strong);
      background: var(--sunken);
      overflow: hidden;
      box-shadow: 0 2px 12px rgb(0 0 0 / 0.35);
    }
    .screen-frame[data-resizing] {
      border-color: var(--accent);
    }
    .device .slot {
      /* In-page devices are the light app in this document: lab styles stop at the slot. */
      color-scheme: light;
      color: #191917;
    }
    .screen,
    .screen-placeholder {
      width: 100%;
      height: 100%;
    }
    .screen {
      display: block;
      cursor: crosshair;
    }
    /* Chrome-like grips just outside the right edge, the bottom edge and their corner. */
    button.screen-handle:not(.slot *) {
      position: absolute;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0 0 3px 0;
      background: var(--raised);
      touch-action: none;
      transition: background-color 120ms ease;
    }
    button.screen-handle:not(.slot *):hover,
    button.screen-handle:not(.slot *):focus-visible,
    button.screen-handle:not(.slot *):active {
      background: var(--hover);
    }
    button.screen-handle:not(.slot *):active {
      transform: none;
    }
    button.screen-handle::after {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
      border-radius: 1px;
      background: var(--muted);
    }
    .screen-handle.edge-x {
      top: 0;
      left: 100%;
      width: 12px;
      height: 100%;
      border-radius: 0 3px 0 0 !important;
      cursor: ew-resize;
    }
    .screen-handle.edge-x::after {
      width: 2px;
      height: 24px;
      box-shadow: 3px 0 0 var(--muted);
      transform: translateX(-1.5px);
    }
    .screen-handle.edge-y {
      top: 100%;
      left: 0;
      width: 100%;
      height: 12px;
      border-radius: 0 0 0 3px !important;
      cursor: ns-resize;
    }
    .screen-handle.edge-y::after {
      width: 24px;
      height: 2px;
      box-shadow: 0 3px 0 var(--muted);
      transform: translateY(-1.5px);
    }
    .screen-handle.edge-xy {
      top: 100%;
      left: 100%;
      width: 12px;
      height: 12px;
      cursor: nwse-resize;
    }
    .screen-handle.edge-xy::after {
      width: 6px;
      height: 6px;
      background: linear-gradient(135deg, transparent 40%, var(--muted) 40% 55%, transparent 55%);
    }
    .screen-stage:has(.screen-frame[data-resizing]) :is(.edge-x, .edge-y)::after {
      background: var(--accent);
      box-shadow: none;
    }
    .screen-placeholder {
      display: grid;
      place-content: center;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .inspector {
      flex: 0 1 auto;
      min-width: 0;
      overflow: clip;
      background: var(--surface);
    }
    .panel-content {
      height: 100%;
      overflow: auto;
    }
    .inspector .panel-content {
      max-width: 100%;
    }
    /* The inspector: tabs stay at the top while the chosen pane scrolls under them. */
    .insp-tabs {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    button.insp-tab:not(.slot *) {
      min-height: 30px;
      padding: 0 12px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
    }
    button.insp-tab:not(.slot *):hover {
      color: var(--text);
      background: var(--surface);
    }
    button.insp-tab[aria-selected="true"]:not(.slot *) {
      color: var(--text);
      background: var(--surface);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    .insp-overview,
    .insp-actions,
    .insp-data {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .insp-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .insp h3 {
      margin: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .insp-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .insp-facts {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 4px 12px;
      margin: 0;
      font-size: 13px;
    }
    .insp-facts dt {
      color: var(--muted);
    }
    .insp-facts dd {
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .insp-rows {
      margin: 0;
      padding: 0;
      list-style: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
    }
    .insp-rows li {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 10px;
      padding: 5px 10px;
    }
    .insp-rows li + li {
      border-top: 1px solid var(--border);
    }
    .insp-rows li > :first-child {
      flex: 1 1 auto;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .insp-muted {
      color: var(--muted);
      font-size: 12px;
    }
    .insp-error {
      margin: 0;
      color: var(--danger);
      font-size: 13px;
    }
    .insp-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
    }
    input.insp-search:not(.slot *) {
      flex: 1 1 160px;
      min-width: 0;
      background: var(--sunken);
    }
    .insp-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
    }
    .insp-check input:not(.slot *) {
      min-height: 0;
      margin: 0;
      accent-color: var(--accent);
    }
    .insp-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .insp-group h3 {
      margin-bottom: 4px;
    }
    .insp-action {
      border: 1px solid transparent;
      border-radius: var(--radius);
    }
    .insp-action[data-open] {
      border-color: var(--border);
      background: var(--bg);
    }
    button.insp-action-head:not(.slot *) {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
      width: 100%;
      min-height: 0;
      padding: 5px 8px;
      border: 0;
      background: transparent;
      text-align: start;
      white-space: normal;
    }
    button.insp-action-head:not(.slot *):hover {
      background: var(--hover);
    }
    button.insp-action-head:not(.slot *):active {
      transform: none;
    }
    .insp-action-name {
      font-size: 13px;
      font-weight: 600;
    }
    .insp-action-note {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
    }
    .insp-action[data-open] .insp-action-note {
      display: none;
    }
    .insp-action[data-unavailable] .insp-action-name {
      color: var(--muted);
      font-weight: 400;
    }
    .insp-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 4px 8px 10px;
    }
    .insp-form button.primary {
      align-self: flex-start;
    }
    .insp-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .insp-field.insp-check {
      flex-direction: row;
      flex-wrap: wrap;
      color: var(--text);
    }
    .insp-field-name {
      font-size: 12px;
      font-weight: 600;
    }
    .insp-field-hint {
      color: var(--muted);
      font-size: 12px;
    }
    .insp-field.insp-check .insp-field-hint {
      flex-basis: 100%;
    }
    .insp-field textarea:not(.slot *) {
      min-height: 64px;
    }
    .insp-outcome {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }
    .insp-outcome:empty {
      display: none;
    }
    .insp-outcome[data-tone="good"] {
      color: var(--good);
    }
    .insp-outcome[data-tone="bad"] {
      color: var(--danger);
    }
    /* The data tree: keys, typed values and counts, one level per indent. */
    .insp-tree {
      font: 12px/1.6 var(--mono);
    }
    .insp-tree details:not(.slot *) > summary {
      margin: 0;
      padding: 0;
      font: inherit;
      letter-spacing: 0;
      text-transform: none;
      color: var(--text);
      display: flex;
      list-style: none;
    }
    .insp-tree summary::-webkit-details-marker {
      display: none;
    }
    /* The triangle takes the first 14px of a row, inside the pane; leaf keys start after it. */
    .insp-tree summary::before {
      content: "▸";
      flex: none;
      width: 14px;
      color: var(--muted);
    }
    .insp-tree details[open] > summary::before {
      content: "▾";
    }
    .insp-tree summary:hover::before {
      color: var(--text);
    }
    .insp-children {
      margin-inline-start: 5px;
      padding-inline-start: 8px;
      border-inline-start: 1px solid var(--border);
    }
    .insp-leaf {
      display: flex;
      padding-inline-start: 14px;
    }
    .insp-key {
      color: #c9b8f2;
      margin-inline-end: 6px;
    }
    .insp-leaf .insp-key::after,
    summary .insp-key::after {
      content: ":";
      color: var(--muted);
    }
    .insp-value {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .insp-leaf[data-kind="string"] .insp-value {
      color: #a8d8a0;
    }
    .insp-leaf[data-kind="number"] .insp-value {
      color: #f0c27a;
    }
    .insp-leaf[data-kind="boolean"] .insp-value,
    .insp-leaf[data-kind="null"] .insp-value {
      color: #8fc3f2;
    }
    /* Server panel: a column of cards. */
    .srv-pane {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 12px;
    }
    .srv-switches {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .srv-inline {
      display: flex;
      gap: 6px;
    }
    .srv-inline input:not(.slot *) {
      flex: 1 1 auto;
      min-width: 0;
    }
    .srv-mono {
      font-family: var(--mono);
      font-size: 12px;
    }
    .srv-result-title {
      font-size: 12px;
      color: var(--muted);
    }
    .insp-result {
      max-height: 320px;
      overflow: auto;
    }
    .srv-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .srv-group-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .srv-stores {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .srv-store,
    .srv-store-table {
      font-size: 13px;
    }
    .srv-store > summary,
    .srv-store-table > summary {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
    }
    .srv-store-table {
      margin-inline-start: 16px;
    }
    .srv-table {
      max-height: 280px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .srv-table table {
      border-collapse: collapse;
      font: 12px var(--mono);
    }
    .srv-table th,
    .srv-table td {
      padding: 3px 8px;
      border-bottom: 1px solid var(--border);
      text-align: start;
      white-space: nowrap;
    }
    .srv-table th {
      position: sticky;
      top: 0;
      background: var(--raised);
      color: var(--muted);
      font-weight: 600;
    }

    /* Timeline: a live log, newest first, under sticky filters. */
    .tl-tools {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 8px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .tl-tools select:not(.slot *) {
      width: auto;
    }
    .tl-count {
      margin-inline-start: auto;
    }
    .tl {
      container-type: inline-size;
    }
    .tl-list {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 12px;
    }
    .tl-empty {
      padding: 16px 12px;
    }
    .tl-row {
      border-bottom: 1px solid var(--border);
    }
    .tl-row > .insp-result {
      padding: 4px 12px 10px;
    }
    button.tl-head:not(.slot *) {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      grid-template-areas: "time kind device status" "summary summary summary summary";
      align-items: baseline;
      gap: 2px 8px;
      width: 100%;
      min-height: 0;
      padding: 4px 12px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      text-align: start;
    }
    button.tl-head:not(.slot *):hover {
      background: var(--surface);
    }
    .tl-time {
      grid-area: time;
    }
    .tl-kind {
      grid-area: kind;
    }
    .tl-device {
      grid-area: device;
    }
    .tl-summary {
      grid-area: summary;
    }
    .tl-status {
      grid-area: status;
    }
    /* Wide enough, each event is one line. */
    @container (min-width: 640px) {
      button.tl-head:not(.slot *) {
        grid-template-columns: 84px 128px minmax(0, 160px) minmax(0, 1fr) auto;
        grid-template-areas: "time kind device summary status";
      }
    }
    .tl-time,
    .tl-status {
      font-family: var(--mono);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .tl-kind {
      justify-self: start;
      padding: 0 6px;
      border-radius: 4px;
      background: var(--raised);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
    }
    .tl-kind[data-category="operation"] {
      color: var(--accent);
    }
    .tl-kind[data-category="app"] {
      color: #b9a3f5;
    }
    .tl-kind[data-category="network"] {
      color: #8fc3f2;
    }
    .tl-kind[data-category="device"],
    .tl-kind[data-category="server"],
    .tl-kind[data-category="host"] {
      color: var(--good);
    }
    .tl-device,
    .tl-summary {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tl-device {
      color: var(--muted);
    }
    .tl-row[data-outcome="failed"] .tl-status,
    .tl-error {
      color: var(--danger);
    }
    .tl-error {
      display: block;
      padding: 0 12px 4px;
      font-family: var(--mono);
    }
    .tl-error:empty {
      display: none;
    }
    .split-separator {
      flex: none;
      position: relative;
      width: 1px;
      background: var(--border);
      cursor: col-resize;
      touch-action: none;
      transition: background-color 120ms ease;
    }
    .split-separator::before {
      content: "";
      position: absolute;
      inset: 0 -3px;
    }
    .split-separator:hover,
    .split-separator[data-resizing],
    .split-separator:focus-visible {
      background: var(--accent);
      outline: none;
    }

    /* The headless host only shows devices, each whole, for the supervisor to screenshot and click. */
    [data-headless] body {
      height: auto;
      overflow: auto;
    }
    [data-headless] #workspace {
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 16px;
      padding: 16px;
    }
    [data-headless] #workspace > .device {
      flex: none;
      overflow: visible;
    }
    [data-headless] :is(.device-split, .device-screen, .device-viewport) {
      flex: none;
      overflow: visible;
    }
    [data-headless] :is(.device-bar, .device-toolbar, .screen-handle) {
      display: none !important;
    }
    #layout-announcement {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
    }
    @media (prefers-reduced-motion: reduce) {
      *:not(.slot *) {
        transition-duration: 0ms !important;
      }
      button:not(.slot *):active {
        transform: none;
      }
    }
  </style>

  </header>
  <div id="layout-announcement" role="status" aria-live="polite"></div>
  <main id="workspace">

    <section id="timeline-panel" data-title="Timeline" aria-label="Ordered timeline"></section>
    <section id="state-panel" data-title="Server state" aria-label="Authoritative server state"></section>

      No devices yet. Choose a kind and add a device to begin an experiment.
    </section>
  </main>
