# Runs everything `npm run check` runs on a fresh checkout: text, build,
# generated types, lint, type checks, a deploy dry run, Worker tests, and the
# browser tests against a local Worker. No Cloudflare account is needed.
# The jobs use the shared app checks (skills docs/app-ci.md), pinned to a
# commit; the stage ids are the ones scripts/verification-ci-result.mjs reads.
name: Check

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: santistebanc/skills/.github/workflows/app-checks.yml@a5b3813c9fd86b8ab69c11349c67e06605b2f286
    with:
      timeout-minutes: 20
      env: |
        WRANGLER_SEND_METRICS=false
        VITEST_MAX_WORKERS=2
      stages: |
        contracts: npm run verify:check
        checks: mkdir -p .wrangler/verification/private && npm run frontend:check > .wrangler/verification/private/check.log 2>&1 && npm run check:fast >> .wrangler/verification/private/check.log 2>&1
      result: VERIFICATION_JOB=check VERIFICATION_OUTCOME="$CHECK_OUTCOME" VERIFICATION_STEPS="$CHECK_STEPS" node scripts/verification-ci-result.mjs
      evidence-path: .wrangler/verification/public/
      evidence-name: verification-check-evidence
      # picomatch ReDoS (via Expo, React Native, Metro and Vitest tooling) has no fixed version yet.
      audit-allow: GHSA-fc5q-39xc-vjpf

  browser:
    needs: check
    uses: santistebanc/skills/.github/workflows/app-checks.yml@a5b3813c9fd86b8ab69c11349c67e06605b2f286
    with:
      timeout-minutes: 35
      browsers: true
      audit: false
      env: |
        WRANGLER_SEND_METRICS=false
      stages: |
        doctor: npm run verify -- doctor --json
        build: mkdir -p .wrangler/verification/private && npm run frontend:build > .wrangler/verification/private/build.log 2>&1
        browsers: npm run test:e2e > .wrangler/verification/private/browser.log 2>&1
      result: VERIFICATION_JOB=browser VERIFICATION_OUTCOME="$CHECK_OUTCOME" VERIFICATION_STEPS="$CHECK_STEPS" node scripts/verification-ci-result.mjs
      evidence-path: .wrangler/verification/public/
      evidence-name: verification-browser-evidence
