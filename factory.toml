# Software factory checks use local state only. Production deploys remain owner actions.
[commands]
setup = "npm ci"
check = "npm run check:fast"
test = "npm run check"

[paths]
ui = ["apps/client/**"]
heavy = ["e2e/**", "showcase/**"]

[rules]
live_network = false

[protection]
required_checks = ["check"]
required_approvals = 1
